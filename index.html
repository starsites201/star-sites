<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceano das Cores da Tartaruguinha 🐢</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #001a33; overflow: hidden; font-family: 'Fredoka One', cursive; color: white; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* HUD Oceânico */
        #hud { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 10; background: rgba(0, 100, 200, 0.4); backdrop-filter: blur(10px);
            padding: 15px 30px; border-radius: 40px; border: 5px solid rgba(255,255,255,0.6);
            text-align: center; width: 85%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        
        /* Círculo da Cor com Brilho */
        #targetColorBox { 
            width: 70px; height: 70px; 
            border-radius: 50%; border: 6px solid #fff;
            box-shadow: 0 0 25px rgba(255,255,255,0.7);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        /* Textos e Tartaruga Gira-Gira */
        .text-group { display: flex; flex-direction: column; align-items: center; }
        .text-color { color: #fff; font-size: 32px; text-transform: uppercase; text-shadow: 0 3px 10px rgba(0,0,0,0.5); margin: 0; }
        
        #guideTurtle {
            font-size: 45px;
            animation: swim 4s infinite linear;
            display: inline-block;
        }
        @keyframes swim { 
            0%, 100% { transform: rotateY(0deg) translateY(0); }
            50% { transform: rotateY(180deg) translateY(-10px); }
        }

        /* Mira Central de Bolhas */
        #aim {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 110px; height: 110px; border: 4px dashed rgba(255,255,255,0.7);
            border-radius: 50%; z-index: 5;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.3; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; } }

        /* Overlay de Sucesso com Bolhas */
        #win { 
            position: absolute; inset: 0; z-index: 100; 
            background: rgba(0, 242, 255, 0.9); backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #winText { color:#fff; font-size: 50px; text-align:center; margin: 20px 0 0 0; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="procCanvas" style="display:none;"></canvas>
        
        <div id="aim"></div>

        <div id="hud">
            <div id="guideTurtle">🐢</div>
            <div class="text-group">
                <div id="targetColorBox"></div>
                <div class="text-color" id="colorName">---</div>
            </div>
        </div>

        <div id="win">
            <div style="font-size: 130px;">🐢💧🎈</div>
            <h2 id="winText">ACHOU!</h2>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('procCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetBox = document.getElementById('targetColorBox');
        const colorName = document.getElementById('colorName');
        const win = document.getElementById('win');

        const missions = [
            { name: "Verde", rgb: [50, 200, 50] },
            { name: "Vermelho", rgb: [220, 50, 50] },
            { name: "Azul", rgb: [50, 80, 255] },
            { name: "Amarelo", rgb: [255, 220, 0] },
            { name: "Rosa", rgb: [255, 100, 200] }
        ];

        let currentMission = 0;
        let isChecking = true;

        // Função para o site falar
        function falar(texto) {
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.0; // Velocidade boa pra criança
            utterance.pitch = 1.2; // Voz levemente mais fofa
            window.speechSynthesis.speak(utterance);
        }

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                
                // Delay para carregar e interação inicial
                setTimeout(() => {
                    updateMission();
                    checkColor();
                }, 1000);
            } catch (err) {
                alert("Erro ao acessar a câmera. Tente aceitar as permissões!");
            }
        }

        function updateMission() {
            const m = missions[currentMission];
            targetBox.style.backgroundColor = `rgb(${m.rgb[0]}, ${m.rgb[1]}, ${m.rgb[2]})`;
            colorName.innerText = m.name;
            colorName.style.color = `rgb(${m.rgb[0]}, ${m.rgb[1]}, ${m.rgb[2]})`;
            falar("Tartaruguinha quer achar a cor " + m.name);
        }

        function checkColor() {
            if (!isChecking) return;

            // Pega um pequeno pedaço do centro da câmera
            canvas.width = 10;
            canvas.height = 10;
            ctx.drawImage(video, video.videoWidth/2 - 5, video.videoHeight/2 - 5, 10, 10, 0, 0, 10, 10);
            const data = ctx.getImageData(0, 0, 10, 10).data;

            let r=0, g=0, b=0;
            for(let i=0; i<data.length; i+=4) {
                r += data[i]; g += data[i+1]; b += data[i+2];
            }
            r /= (data.length/4); g /= (data.length/4); b /= (data.length/4);

            const target = missions[currentMission].rgb;
            const diff = Math.abs(r - target[0]) + Math.abs(g - target[1]) + Math.abs(b - target[2]);

            // Sensibilidade ajustada para ser bem fácil para ela
            if (diff < 160) {
                victory();
            } else {
                requestAnimationFrame(checkColor);
            }
        }

        function victory() {
            isChecking = false;
            // O fundo da vitória vira a cor que ela achou
            win.style.backgroundColor = targetBox.style.backgroundColor;
            win.style.display = 'flex';
            falar("Isso! Você ajudou a tartaruguinha!");
            
            setTimeout(() => {
                win.style.display = 'none';
                currentMission = (currentMission + 1) % missions.length;
                updateMission();
                isChecking = true;
                checkColor();
            }, 3800); // 3.8 segundos de comemoração
        }

        // Inicia ao clicar (navegadores exigem interação para falar)
        document.body.addEventListener('click', () => {
            if (!video.srcObject) {
                falar("Vamos começar o jogo da tartaruguinha!");
                start();
            }
        }, { once: true });
    </script>
</body>
</html>
